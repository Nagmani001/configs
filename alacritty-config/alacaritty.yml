font:
  # The normal (roman) font face.
  normal:
    family: "Monospace"
    style: Regular

  # The bold font face.
  bold:
    family: "Monospace"
    style: Bold

  # The italic font face.
  italic:
    family: "Monospace"
    style: Italic

  # The font size.
  size: 5.0  # This is the default font size.
