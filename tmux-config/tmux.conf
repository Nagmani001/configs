unbind C-b
set-option -g prefix F1
bind F1 send-prefix

# --- Split panes ---
# Vertical split (side by side) with leader + m
bind m split-window -h

# Horizontal split (stacked) with leader + u
bind u split-window -v

# --- Vim-style pane navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Optional: allow pane resizing with Shift + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Allow mouse scrolling in tmux
set -g mouse on

# Use the scroll wheel to enter copy mode automatically
bind -T root WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"
bind -T root WheelDownPane select-pane -t= \; send-keys -M

# Faster scroll in copy mode
setw -g mode-keys vi

